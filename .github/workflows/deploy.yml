name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ../gh-pages-deploy origin/gh-pages

          cd ../gh-pages-deploy

          git rm -rf . || true

          cp -R ../thdrc-rebuild/dist/. .

          touch .nojekyll

          git add -A

          git commit -m "Deploy ${GITHUB_SHA}" || echo "No changes to deploy"
          git push origin HEAD:gh-pages
